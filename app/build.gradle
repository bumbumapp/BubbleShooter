apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

// Huawei Ads (Petal) slot IDs for the AppGallery (hms) build; override with -PHMS_BANNER_ID=... or a
// gitignored ads.properties. Debug builds always use Huawei's public test slots.
def adsProps = new Properties()
def adsFile = rootProject.file('ads.properties')
if (adsFile.exists()) adsFile.withInputStream { adsProps.load(it) }
def adId = { String key, String fallback -> ((project.findProperty(key) ?: adsProps.getProperty(key))?.toString()?.trim()) ?: fallback }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_BANNER_ID = adId('HMS_BANNER_ID', 'i388k3ctwu')
def HMS_INTERSTITIAL_ID = adId('HMS_INTERSTITIAL_ID', 'u91ukfv7jb')

android {
    namespace 'com.company.game'
    compileSdk 36
    defaultConfig {
        applicationId 'com.bumbumapps.bubbleshootergame'
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName '1.3.0'
    }
    buildFeatures {
        buildConfig true
        resValues true
    }
    buildTypes {
        debug {
            // Google's public test IDs so debug builds never request real ads.
            resValue 'string', 'admob_app_id', 'ca-app-pub-3940256099942544~3347511713'
            resValue 'string', 'banner_id', 'ca-app-pub-3940256099942544/9214589741'
            resValue 'string', 'interstitial_id', 'ca-app-pub-3940256099942544/1033173712'
        }
        release {
            // Real AdMob IDs (AdMob app for com.bumbumapps.bubbleshootergame, from the AdMob API).
            resValue 'string', 'admob_app_id', 'ca-app-pub-8444865753152507~1061065535'
            resValue 'string', 'banner_id', 'ca-app-pub-8444865753152507/4808738852'
            resValue 'string', 'interstitial_id', 'ca-app-pub-8444865753152507/4589247003'
            minifyEnabled false
        }
    }
    // play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', HMS_BANNER_ID
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation project(':CordovaLib')
    implementation 'androidx.core:core:1.17.0'
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    // Analytics needs Google Play services (and brings the advertising-ID client): Play build only.
    playImplementation 'com.google.firebase:firebase-analytics'
    testImplementation 'junit:junit:4.13.2'
}
